name: Deploy React apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 부산 맛집
      - name: Install busan-food-react
        working-directory: busan-food-react
        run: npm install

      - name: Build busan-food-react
        working-directory: busan-food-react
        run: npm run build

      # 책쉼표
      - name: Install 02_bookcomma
        working-directory: 02_bookcomma
        run: npm install

      - name: Build 02_bookcomma
        working-directory: 02_bookcomma
        run: npm run build

      # VUEON
      - name: Install VUEON-React
        working-directory: VUEON-React
        run: npm install

      - name: Build VUEON-React
        working-directory: VUEON-React
        run: npm run build
        env:
          REACT_APP_TMDB_API_KEY: ${{ secrets.REACT_APP_TMDB_API_KEY }}

      # 배포 폴더 구성
      - name: Prepare Pages artifact
        run: |
          mkdir -p site

          cp -r busan-food-react/dist/* site/

          mkdir -p site/02_bookcomma
          cp -r 02_bookcomma/dist/* site/02_bookcomma/

          mkdir -p site/VUEON-React
          cp -r VUEON-React/build/* site/VUEON-React/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
